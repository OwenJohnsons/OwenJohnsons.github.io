---
layout: default
---
<article class="post">
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y-%m-%d' }}</time>
    {% for tag in page.tags %}<span class="tag">#{{ tag }}</span>{% endfor %}
  </p>
  <h1>{{ page.title }}</h1>
  <div class="post-body">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/blog/' | relative_url }}">cd ../blog</a></p>
</article>
