<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/images/favicons/radio.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <div class="crt" aria-hidden="true"></div>

  <header class="site-header">
    <a class="prompt" href="{{ '/' | relative_url }}">visitor@owen:~$</a>
    {% include nav.html %}
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>© {{ site.time | date: '%Y' }} {{ site.data.profile.name }}</span>
    <span>
      {% for link in site.data.profile.links %}<a href="{{ link.url }}">{{ link.label }}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}
    </span>
  </footer>
</body>
</html>
